# THIS FILE IS EXCLUSIVELY MAINTAINED by the project aedev.project_tpls v0.3.109
image: python:3.12
 
 
.check_rules: &check-rules      # minimize job-runs on gitlab CI by separating rules for push/test and deploy
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: never
    - if: $CI_COMMIT_TAG        # - if: $CI_COMMIT_TAG =~ /^v?[0-9]+[.][0-9]+([.][0-9]+)?$/
      when: never               # CI_COMMIT_TAG is only set if the push does contain a new tag (after commit)
    - if: $CI_COMMIT_BRANCH
.release_rules: &release-rules  # release branch triggers deploy to PyPI
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^release/

integrity:                      # run integrity tests
  stage: test
  <<: *check-rules
  before_script:
    - python --version
    - pip --version
    - pip install --upgrade pip pipx setuptools
    - pip --version
    - >
      pip install --upgrade --force-reinstall --uploaded-prior-to=P3D
      anybadge==1.16.0
      coverage==7.17.2
      flake8==7.5.0
      mypy==2.4.1
      packaging==26.3
      pillow==13.0.0
      types-Pillow==10.2.0.20240822
      PyGithub==2.10.0
      pylint==4.1.3
      pytest==9.2.0
      pytest-cov==7.1.0
      python-gitlab==8.6.0
      requests==2.34.2
      anybadge==1.16.0
      flake8==7.5.0
      mypy==2.4.1
      pylint==4.1.3
      pytest==9.2.0
      pytest-cov==7.1.0
      typing==3.7.4.3
      types-setuptools==84.2.0.20261104
    - >
      pip install --upgrade --force-reinstall 
      ae_base==0.4.98
      ae_system==0.3.21
      ae_paths==0.3.49
      ae_dynamicod==0.3.17
      ae_literal==0.3.36
      ae_core==0.3.90
      ae_console==0.3.99
      ae_shell==0.3.20
      ae_managed_files==0.3.9
      ae_pythonanywhere==0.3.11
      aedev_base==0.3.15
      aedev_commands==0.3.21
      aedev_project_vars==0.3.27
  script:
    - pipx run --spec aedev_project_manager project-manager -v check-integrity
    - |
      if [ -f tests/requirements.txt ]; then
        MISSING=""
        for d in $ARTIFACT_DIRS; do
          [ -d "$d" ] || MISSING="$MISSING $d"
        done
        if [ -n "$MISSING" ]; then
          echo "CI-CHECK-ERROR: tests/requirements.txt exists, but required artifact paths were not created:"
          for d in $MISSING; do
            echo "    - $d/"
          done
          exit 1
        fi
      else
        mkdir -p $ARTIFACT_DIRS
      fi
  variables:
    ARTIFACT_DIRS: "mypy_report .pylint htmlcov .pytest_cache"
  artifacts:
    paths:  # unremovable redundancy with integrity.variables.ARTIFACT_DIRS and the `cp`-commands in pages.script
      - mypy_report/
      - .pylint/
      - htmlcov/
      - .pytest_cache/

pages:                          # prepare artifacts for release
  stage: deploy
  needs:
    - integrity
  <<: *release-rules
  script:
    - ls -l -R
    - mkdir -p public/coverage
    - |
      if [ -f tests/requirements.txt ]; then
        cp -a -f -v htmlcov/. public/coverage/
        cp -a -f -v .pytest_cache/coverage.svg public/
        cp -a -f -v mypy_report/lineprecision.txt public/
        cp -a -f -v mypy_report/mypy.svg public/
        cp -a -f -v .pylint/pylint.svg public/
        cp -a -f -v .pylint/pylint.log public/
      fi
  artifacts:
    paths:
      - public

pypi_deploy:                    # release to PyPI
  stage: deploy
  needs:
    - integrity
  <<: *release-rules
  variables:
    # the pushed branch has to be a protected branch in order to get the CI variables for the twine/PyPI authentication.
    TWINE_USERNAME: $PYPI_USERNAME
    TWINE_PASSWORD: $PYPI_PASSWORD
  before_script:
     - pip install --upgrade build pip twine
     - python -m build
  script:
    # use test.pypi.org for integration/unit test projects (if is under :data:`~aedev.base.TEST_PROJECTS_PARENT_FOLDER`)
    - twine upload --verbose dist/*
