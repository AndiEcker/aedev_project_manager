# THIS FILE IS EXCLUSIVELY MAINTAINED by the project aedev.project_tpls v0.3.100
image: python:3.12





.check_rules: &check-rules
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^release/
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH

integrity:
  <<: *check-rules
  before_script:
    - python --version
    - pip --version
    - pip install --upgrade pip pipx setuptools
    - pip --version
    - >
      pip install --upgrade --force-reinstall --uploaded-prior-to=P9D
      -r requirements_frozen.txt
      -r tests/requirements_frozen.txt
    - pip install --upgrade --force-reinstall ae_base==0.3.93 ae_system==0.3.15 ae_paths==0.3.46 ae_dynamicod==0.3.16 ae_literal==0.3.36 ae_updater==0.3.20 ae_core==0.3.88 ae_console==0.3.97 ae_shell==0.3.15 ae_managed_files==0.3.9 ae_pythonanywhere==0.3.9 aedev_base==0.3.10 aedev_commands==0.3.16 aedev_project_vars==0.3.22
  script:
    - pipx run --spec aedev_project_manager project-manager -v check-integrity
    - |
      if [ -f tests/requirements.txt ]; then
        MISSING=""
        for d in $ARTIFACT_DIRS; do
          [ -d "$d" ] || MISSING="$MISSING $d"
        done
        if [ -n "$MISSING" ]; then
          echo "CI-CHECK-ERROR: tests/requirements.txt exists, but required artifact paths were not created:"
          for d in $MISSING; do
            echo "    - $d/"
          done
          exit 1
        fi
      else
        mkdir -p $ARTIFACT_DIRS
      fi
  variables:
    ARTIFACT_DIRS: "mypy_report .pylint htmlcov .pytest_cache"
  artifacts:
    paths:  # unremovable redundancy with integrity.variables.ARTIFACT_DIRS and the `cp`-commands in pages.script
      - mypy_report/
      - .pylint/
      - htmlcov/
      - .pytest_cache/

pages:
  stage: deploy
  dependencies:
    - integrity
  <<: *check-rules
  script:
    - ls -l -R
    - mkdir -p public/coverage
    - |
      if [ -f tests/requirements.txt ]; then
        cp -a -f -v htmlcov/. public/coverage/
        cp -a -f -v .pytest_cache/coverage.svg public/
        cp -a -f -v mypy_report/lineprecision.txt public/
        cp -a -f -v mypy_report/mypy.svg public/
        cp -a -f -v .pylint/pylint.svg public/
        cp -a -f -v .pylint/pylint.log public/
      fi
  artifacts:
    paths:
      - public


pypi_deploy:
  stage: deploy
  rules:
    # - if: $CI_COMMIT_TAG =~ /^v?[0-9]+[.][0-9]+([.][0-9]+)?$/
    # CI_COMMIT_TAG is only set if the push does contain a new tag (and no new commit); separate push and rules are
    # additionally creating duplicate jobs on gitlab CI - finally using release branch to trigger deploy.
    - if: $CI_COMMIT_BRANCH =~ /^release/
  variables:
    # the pushed branch has to be a protected branch in order to get the CI variables for the twine/PyPI authentication.
    TWINE_USERNAME: $PYPI_USERNAME
    TWINE_PASSWORD: $PYPI_PASSWORD
  before_script:
     - pip install --upgrade build pip twine
     - python -m build
  script:
    # use test.pypi.org for integration/unit test projects (if is under :data:`~aedev.base.TEST_PROJECTS_PARENT_FOLDER`)
    - twine upload --verbose dist/*
